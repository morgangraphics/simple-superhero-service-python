[project]
name = "simple-superhero-service"
version = "2.0.0"
description = "A self-contained superhero data service built with FastAPI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
    "anyio[trio]>=4.7.0",
    "coverage>=7.6.0",
    "black>=24.10.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["service"]

[tool.pytest.ini_options]
testpaths = ["unit"]

[tool.coverage.run]
branch = true
source = ["service"]

[tool.bandit]
skips = ["B101"]
